name: Lint

# 每次 push / PR 都跑，無編譯，數秒內結束。
# 規則的唯一真相來源是 scripts/lint.py（同一支也被 build.sh / build.ps1 在編譯時呼叫），
# 不再把檢查邏輯內嵌在本 YAML，避免規則在 bash / PowerShell / CI 三處抄寫漂移。
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  lint-skill:
    name: Lint Skill markdown
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      # 用 --ci 跑全套：SKILL frontmatter + 所有 skeleton/examples 論文 + 所有 marp 簡報。
      # 只有 error 級會讓 CI 失敗；warn 級（死引用）留給互動式 build / 本機顯示。
      - name: Run PaperForge lint (scripts/lint.py)
        run: python3 scripts/lint.py --ci
