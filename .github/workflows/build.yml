name: Build Examples

# 編譯範例 PDF 較重，但靠 docker/ 下預建的 build image 就不必每次都重跑 apt install
# 或下載 Chrome for Testing。
#
# Flow：
#   每個 job 自己 build docker image（load 進本地 docker daemon，不推 registry），
#   再用 docker run 把該 image 當編譯環境跑，跳過 apt install / npm install。
#   靠 GHA layer cache（type=gha），第二次跑時 docker build 大多 cache hit。
#
# 為什麼不推 GHCR：fork 來的 pull_request，GITHUB_TOKEN 一律唯讀，push 到 GHCR 會被
# `denied: installation not allowed to write organization package` 擋下。改成同 job 內
# load + docker run，就不依賴 registry，對 fork PR 也能跑（順帶省掉推/拉數 GB image）。
#
# 觸發時機：
#   - PR 開啟/更新時
#   - 手動觸發
#   - push 到 main 但有改到編譯相關檔案
on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'profiles/**'
      - 'shared/**'
      - 'examples/**'
      - 'scripts/build.sh'
      - 'scripts/build.ps1'
      - 'scripts/build-slides.sh'
      - 'scripts/build-slides.ps1'
      - 'Makefile'
      - 'docker/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build PDFs on Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 只 load 進本地 daemon，不推 registry。GHA cache 讓第二次 build 大多 cache hit。
      - name: Build paper image (local, no registry)
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/paper.Dockerfile
          load: true
          tags: paperforge-paper:ci
          cache-from: type=gha,scope=paperforge-paper
          cache-to: type=gha,mode=max,scope=paperforge-paper

      - name: Verify environment
        run: |
          docker run --rm paperforge-paper:ci bash -c '
            pandoc --version | head -n1
            xelatex --version | head -n1
            biber --version | head -n1
            fc-list :lang=zh-tw | head -n5
          '

      - name: Make build script executable
        run: chmod +x scripts/build.sh

      # 自動枚舉每個 paper 類 profile 的 skeleton 並編譯。
      # 新增 profile 時這裡一行都不用改：放進 profiles/<name>/skeleton/paper.md 即受涵蓋。
      #
      # skeleton 保留真實論文字體（如標楷體 / Times New Roman），CI 容器沒有這些字體，
      # 因此用 --main-font / --cjk-font 強制覆寫為容器內的免費替身。
      # CJK 用「AR PL UKai」免費楷體（非明體），與真實標楷體同為楷體，
      # 能驗出楷體缺 glyph 問題；這把字體維度對「所有」profile（含未來新增）一次中和。
      #
      # build.sh 在 container 內跑（吃 pandoc/xelatex），產物經 bind mount 落回 host，
      # 後面的存在/大小驗證直接在 host 跑。
      - name: Build & verify every profile skeleton (paper)
        shell: bash
        env:
          CI_MAIN_FONT: "Latin Modern Roman"
          CI_CJK_FONT: "AR PL UKai TW"
        run: |
          run() { docker run --rm -v "$PWD":/workspace -w /workspace paperforge-paper:ci "$@"; }
          shopt -s nullglob
          found=0
          for md in profiles/*/skeleton/paper.md; do
            found=$((found + 1))
            echo "::group::build $md"
            run ./scripts/build.sh "$md" --main-font "$CI_MAIN_FONT" --cjk-font "$CI_CJK_FONT" --verbose
            echo "::endgroup::"
            pdf="${md%/paper.md}/paper.pdf"
            if [ ! -f "$pdf" ]; then
              echo "::error::Missing PDF: $pdf"; exit 1
            fi
            size=$(stat -c%s "$pdf")
            if [ "$size" -lt 10240 ]; then
              echo "::error::PDF too small ($size bytes): $pdf"; exit 1
            fi
            echo "PASS: $pdf ($size bytes)"
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::No profiles/*/skeleton/paper.md found"; exit 1
          fi
          echo "Compiled $found paper skeleton(s)."

      # examples/full 額外驗證富功能（圖表 / 公式 / 引用），與 skeleton smoke test 互補。
      - name: Build & verify full example (feature coverage)
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace paperforge-paper:ci \
            ./scripts/build.sh examples/full/paper.md --verbose
          pdf="examples/full/paper.pdf"
          size=$(stat -c%s "$pdf")
          [ "$size" -ge 10240 ] || { echo "::error::PDF too small ($size): $pdf"; exit 1; }
          echo "PASS: $pdf ($size bytes)"

      - name: Upload PDFs as artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: paper-pdfs
          path: |
            profiles/*/skeleton/paper.pdf
            examples/full/paper.pdf
          retention-days: 30

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            profiles/**/*.log
            profiles/**/*.tex
            profiles/**/*.aux
            profiles/**/*.blg
            examples/**/*.log
            examples/**/*.tex
            examples/**/*.aux
            examples/**/*.blg
          retention-days: 7

  build-slides:
    name: Build Marp Slides on Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build slides image (local, no registry)
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/slides.Dockerfile
          load: true
          tags: paperforge-slides:ci
          cache-from: type=gha,scope=paperforge-slides
          cache-to: type=gha,mode=max,scope=paperforge-slides

      - name: Verify environment
        run: |
          docker run --rm paperforge-slides:ci bash -c '
            node --version
            marp --version
            fc-list :lang=zh-tw | head -n3
          '

      - name: Make build script executable
        run: chmod +x scripts/build-slides.sh

      # 自動枚舉每個 slides 類 profile 的 skeleton 並編譯（PDF + HTML）。
      # 新增 slides profile 時這裡一行都不用改。
      - name: Build & verify every profile skeleton (slides)
        shell: bash
        run: |
          run() { docker run --rm -v "$PWD":/workspace -w /workspace paperforge-slides:ci "$@"; }
          shopt -s nullglob
          found=0
          for md in profiles/*/skeleton/slides.md; do
            found=$((found + 1))
            base="${md%/slides.md}"
            echo "::group::build $md"
            run ./scripts/build-slides.sh "$md" --pdf --verbose
            run ./scripts/build-slides.sh "$md" --html
            echo "::endgroup::"
            pdf="$base/slides.pdf"
            if [ ! -f "$pdf" ]; then
              echo "::error::Missing PDF: $pdf"; exit 1
            fi
            size=$(stat -c%s "$pdf")
            if [ "$size" -lt 102400 ]; then
              echo "::error::PDF too small ($size bytes, expected > 100 KB): $pdf"; exit 1
            fi
            html="$base/slides.html"
            if [ ! -f "$html" ]; then
              echo "::error::Missing HTML: $html"; exit 1
            fi
            echo "PASS: $pdf ($size bytes), $html ($(stat -c%s "$html") bytes)"
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::No profiles/*/skeleton/slides.md found"; exit 1
          fi
          echo "Compiled $found slides skeleton(s)."

      - name: Upload slides artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: slides-outputs
          path: |
            profiles/*/skeleton/slides.pdf
            profiles/*/skeleton/slides.html
          retention-days: 30
