name: Build Examples

# 編譯範例 PDF 較重，但靠 docker/ 下預建的 build image 就不必每次都重跑 apt install
# 或下載 Chrome for Testing。
#
# Flow：
#   1. prepare-*-image：build docker image，推到 GHCR，tag = ci-<run_id>。
#      使用 GHA cache，第二次 PR 跑時 docker build 大多 cache hit。
#   2. build / build-slides：以該 image 當 container 跑，跳過 apt install / npm install。
#
# 觸發時機：
#   - PR 開啟/更新時
#   - 手動觸發
#   - push 到 main 但有改到編譯相關檔案
on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'profiles/**'
      - 'shared/**'
      - 'examples/**'
      - 'scripts/build.sh'
      - 'scripts/build.ps1'
      - 'scripts/build-slides.sh'
      - 'scripts/build-slides.ps1'
      - 'Makefile'
      - 'docker/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read
  packages: write

env:
  IMAGE_TAG: ci-${{ github.run_id }}

jobs:
  prepare-paper-image:
    name: Prepare paper build image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase owner
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build & push paper image
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/paper.Dockerfile
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.owner }}/paperforge-paper:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=paperforge-paper
          cache-to: type=gha,mode=max,scope=paperforge-paper

      - name: Expose image ref
        id: ref
        run: echo "image=ghcr.io/${{ steps.owner.outputs.owner }}/paperforge-paper:${{ env.IMAGE_TAG }}" >> "$GITHUB_OUTPUT"

  prepare-slides-image:
    name: Prepare slides build image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase owner
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build & push slides image
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/slides.Dockerfile
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.owner }}/paperforge-slides:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=paperforge-slides
          cache-to: type=gha,mode=max,scope=paperforge-slides

      - name: Expose image ref
        id: ref
        run: echo "image=ghcr.io/${{ steps.owner.outputs.owner }}/paperforge-slides:${{ env.IMAGE_TAG }}" >> "$GITHUB_OUTPUT"

  build:
    name: Build PDFs on Ubuntu
    needs: prepare-paper-image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ${{ needs.prepare-paper-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify environment
        run: |
          pandoc --version | head -n1
          xelatex --version | head -n1
          biber --version | head -n1
          fc-list :lang=zh-tw | head -n5

      - name: Make build script executable
        run: chmod +x scripts/build.sh

      # 自動枚舉每個 paper 類 profile 的 skeleton 並編譯。
      # 新增 profile 時這裡一行都不用改：放進 profiles/<name>/skeleton/paper.md 即受涵蓋。
      - name: Build & verify every profile skeleton (paper)
        shell: bash
        run: |
          shopt -s nullglob
          found=0
          for md in profiles/*/skeleton/paper.md; do
            found=$((found + 1))
            echo "::group::build $md"
            ./scripts/build.sh "$md" --verbose
            echo "::endgroup::"
            pdf="${md%/paper.md}/paper.pdf"
            if [ ! -f "$pdf" ]; then
              echo "::error::Missing PDF: $pdf"; exit 1
            fi
            size=$(stat -c%s "$pdf")
            if [ "$size" -lt 10240 ]; then
              echo "::error::PDF too small ($size bytes): $pdf"; exit 1
            fi
            echo "PASS: $pdf ($size bytes)"
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::No profiles/*/skeleton/paper.md found"; exit 1
          fi
          echo "Compiled $found paper skeleton(s)."

      # examples/full 額外驗證富功能（圖表 / 公式 / 引用），與 skeleton smoke test 互補。
      - name: Build & verify full example (feature coverage)
        run: |
          ./scripts/build.sh examples/full/paper.md --verbose
          pdf="examples/full/paper.pdf"
          size=$(stat -c%s "$pdf")
          [ "$size" -ge 10240 ] || { echo "::error::PDF too small ($size): $pdf"; exit 1; }
          echo "PASS: $pdf ($size bytes)"

      - name: Upload PDFs as artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: paper-pdfs
          path: |
            profiles/*/skeleton/paper.pdf
            examples/full/paper.pdf
          retention-days: 30

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            profiles/**/*.log
            profiles/**/*.tex
            profiles/**/*.aux
            profiles/**/*.blg
            examples/**/*.log
            examples/**/*.tex
            examples/**/*.aux
            examples/**/*.blg
          retention-days: 7

  build-slides:
    name: Build Marp Slides on Ubuntu
    needs: prepare-slides-image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ${{ needs.prepare-slides-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify environment
        run: |
          node --version
          marp --version
          fc-list :lang=zh-tw | head -n3

      - name: Make build script executable
        run: chmod +x scripts/build-slides.sh

      # 自動枚舉每個 slides 類 profile 的 skeleton 並編譯（PDF + HTML）。
      # 新增 slides profile 時這裡一行都不用改。
      - name: Build & verify every profile skeleton (slides)
        shell: bash
        run: |
          shopt -s nullglob
          found=0
          for md in profiles/*/skeleton/slides.md; do
            found=$((found + 1))
            base="${md%/slides.md}"
            echo "::group::build $md"
            ./scripts/build-slides.sh "$md" --pdf --verbose
            ./scripts/build-slides.sh "$md" --html
            echo "::endgroup::"
            pdf="$base/slides.pdf"
            if [ ! -f "$pdf" ]; then
              echo "::error::Missing PDF: $pdf"; exit 1
            fi
            size=$(stat -c%s "$pdf")
            if [ "$size" -lt 102400 ]; then
              echo "::error::PDF too small ($size bytes, expected > 100 KB): $pdf"; exit 1
            fi
            html="$base/slides.html"
            if [ ! -f "$html" ]; then
              echo "::error::Missing HTML: $html"; exit 1
            fi
            echo "PASS: $pdf ($size bytes), $html ($(stat -c%s "$html") bytes)"
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::No profiles/*/skeleton/slides.md found"; exit 1
          fi
          echo "Compiled $found slides skeleton(s)."

      - name: Upload slides artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: slides-outputs
          path: |
            profiles/*/skeleton/slides.pdf
            profiles/*/skeleton/slides.html
          retention-days: 30
